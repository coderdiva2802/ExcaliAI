services:
  postgres:
    image: postgres:16-alpine
    container_name: excaliai-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: excaliai
      POSTGRES_PASSWORD: excaliai
      POSTGRES_DB: excaliai
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
